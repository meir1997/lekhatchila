<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לומדים אותיות עם אריאל</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(160deg, #fef6e4 0%, #e0f4ff 100%);
            min-height: 100vh;
            color: #2b2b4f;
        }

        header {
            text-align: center;
            padding: 24px 16px 8px;
        }

        h1 {
            font-size: clamp(1.6rem, 6vw, 2.6rem);
            font-weight: 800;
            background: linear-gradient(90deg, #ff6b6b, #f7b733, #2ec4b6, #5f6caf);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { font-size: 1.1rem; color: #6b6b8f; margin-top: 4px; }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 16px 0;
        }

        .tab-btn {
            font-family: inherit;
            font-size: 1.15rem;
            font-weight: 600;
            padding: 10px 26px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            background: #fff;
            color: #6b6b8f;
            box-shadow: 0 2px 8px rgba(43, 43, 79, 0.12);
            transition: transform 0.15s, background 0.15s, color 0.15s;
        }

        .tab-btn.active {
            background: #ff6b6b;
            color: #fff;
            transform: scale(1.06);
        }

        main { max-width: 900px; margin: 0 auto; padding: 0 12px 48px; }

        /* ---- letter grid ---- */
        .letter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 12px;
        }

        .letter-card {
            font-family: inherit;
            border: none;
            border-radius: 20px;
            padding: 14px 6px 10px;
            cursor: pointer;
            color: #fff;
            text-align: center;
            box-shadow: 0 4px 10px rgba(43, 43, 79, 0.18);
            transition: transform 0.12s;
        }

        .letter-card:active { transform: scale(0.92); }

        .letter-card .glyph { display: block; font-size: 2.8rem; font-weight: 800; line-height: 1.1; }
        .letter-card .emoji { display: block; font-size: 1.5rem; margin-top: 2px; }

        /* ---- big letter popup ---- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(43, 43, 79, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 10;
        }

        .overlay.show { display: flex; }

        .big-card {
            background: #fff;
            border-radius: 32px;
            padding: 32px 40px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            animation: pop 0.25s ease-out;
        }

        @keyframes pop {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .big-card .glyph { font-size: 7rem; font-weight: 800; line-height: 1; }
        .big-card .name { font-size: 1.8rem; font-weight: 600; margin-top: 8px; }
        .big-card .word { font-size: 1.5rem; color: #6b6b8f; margin-top: 6px; }
        .big-card .emoji { font-size: 3.5rem; margin-top: 8px; }

        .big-card .actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }

        .round-btn {
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 999px;
            padding: 12px 24px;
            cursor: pointer;
            color: #fff;
        }

        .round-btn.listen { background: #2ec4b6; }
        .round-btn.close { background: #b8b8d0; }

        /* ---- game ---- */
        #game { display: none; text-align: center; }

        .game-question {
            font-size: 1.6rem;
            font-weight: 600;
            margin: 12px 0 4px;
        }

        .game-target { font-size: 2rem; font-weight: 800; color: #ff6b6b; }

        .game-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(110px, 150px));
            gap: 16px;
            justify-content: center;
            margin: 24px 0;
        }

        .game-option {
            font-family: inherit;
            font-size: 4rem;
            font-weight: 800;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 18px 0;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(43, 43, 79, 0.18);
            transition: transform 0.12s;
        }

        .game-option:active { transform: scale(0.92); }
        .game-option.correct { animation: bounce 0.5s; }
        .game-option.wrong { animation: shake 0.4s; opacity: 0.45; }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            40% { transform: scale(1.25); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .game-feedback { font-size: 1.6rem; min-height: 2.2rem; font-weight: 600; }

        /* ---- matching game ---- */
        #match { display: none; text-align: center; }

        .match-board {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin: 20px 0;
        }

        .match-col { display: flex; flex-direction: column; gap: 14px; }

        .match-card {
            font-family: inherit;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            min-width: 130px;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(43, 43, 79, 0.18);
            transition: transform 0.12s, opacity 0.3s;
        }

        .match-card:active { transform: scale(0.94); }
        .match-card.letter { font-size: 2.6rem; font-weight: 800; color: #fff; }

        .match-card.word {
            background: #fff;
            font-size: 1.3rem;
            font-weight: 600;
            color: #2b2b4f;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .match-card.word span:first-child { font-size: 2rem; }
        .match-card.selected { outline: 4px solid #2b2b4f; transform: scale(1.05); }
        .match-card.matched { opacity: 0.3; pointer-events: none; }
        .match-card.wrong { animation: shake 0.4s; }

        .game-score {
            display: inline-block;
            margin-top: 12px;
            font-size: 1.2rem;
            background: #fff;
            border-radius: 999px;
            padding: 8px 22px;
            box-shadow: 0 2px 8px rgba(43, 43, 79, 0.12);
        }

        .stars { font-size: 1.4rem; letter-spacing: 2px; min-height: 1.8rem; margin-top: 6px; }

        footer { text-align: center; padding: 16px; color: #9a9ab8; font-size: 0.95rem; }
    </style>
</head>
<body>
    <header>
        <h1>לומדים אותיות עם אריאל! 🎈</h1>
        <p class="subtitle">לוחצים על אות — ושומעים אותה</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" id="tab-learn">📖 האותיות</button>
        <button class="tab-btn" id="tab-game">🎮 משחק</button>
        <button class="tab-btn" id="tab-match">🧩 התאמה</button>
    </div>

    <main>
        <section id="learn">
            <div class="letter-grid" id="letterGrid"></div>
        </section>

        <section id="game">
            <p class="game-question">איפה האות...</p>
            <p class="game-target" id="gameTarget"></p>
            <div class="game-options" id="gameOptions"></div>
            <p class="game-feedback" id="gameFeedback"></p>
            <div class="game-score">נקודות: <span id="gameScore">0</span></div>
            <div class="stars" id="gameStars"></div>
        </section>

        <section id="match">
            <p class="game-question">מתאימים אות למילה!</p>
            <div class="match-board">
                <div class="match-col" id="matchLetters"></div>
                <div class="match-col" id="matchWords"></div>
            </div>
            <p class="game-feedback" id="matchFeedback"></p>
            <div class="game-score">זוגות: <span id="matchScore">0</span></div>
        </section>
    </main>

    <div class="overlay" id="overlay">
        <div class="big-card">
            <span class="glyph" id="bigGlyph"></span>
            <p class="name" id="bigName"></p>
            <p class="word" id="bigWord"></p>
            <span class="emoji" id="bigEmoji"></span>
            <div class="actions">
                <button class="round-btn listen" id="btnListen">🔊 עוד פעם</button>
                <button class="round-btn close" id="btnClose">סגור</button>
            </div>
        </div>
    </div>

    <footer>באהבה לאריאל ❤️</footer>

    <script>
        const LETTERS = [
            { glyph: 'א', name: 'אָלֶף',  word: 'אַרְיֵה',   emoji: '🦁' },
            { glyph: 'ב', name: 'בֵּית',  word: 'בַּיִת',    emoji: '🏠' },
            { glyph: 'ג', name: 'גִימֶל', word: 'גָּמָל',    emoji: '🐪' },
            { glyph: 'ד', name: 'דָלֶת',  word: 'דָּג',      emoji: '🐟' },
            { glyph: 'ה', name: 'הֵא',    word: 'הַר',      emoji: '⛰️' },
            { glyph: 'ו', name: 'וָו',    word: 'וֶרֶד',     emoji: '🌹' },
            { glyph: 'ז', name: 'זַיִן',  word: 'זְבְּרָה',   emoji: '🦓' },
            { glyph: 'ח', name: 'חֵית',   word: 'חָתוּל',    emoji: '🐱' },
            { glyph: 'ט', name: 'טֵית',   word: 'טְרַקְטוֹר', emoji: '🚜' },
            { glyph: 'י', name: 'יוֹד',   word: 'יָרֵחַ',    emoji: '🌙' },
            { glyph: 'כ', name: 'כָּף',   word: 'כֶּלֶב',    emoji: '🐶' },
            { glyph: 'ל', name: 'לָמֶד',  word: 'לִימוֹן',   emoji: '🍋' },
            { glyph: 'מ', name: 'מֵם',    word: 'מַיִם',     emoji: '💧' },
            { glyph: 'נ', name: 'נוּן',   word: 'נָחָשׁ',    emoji: '🐍' },
            { glyph: 'ס', name: 'סָמֶך',  word: 'סוּס',     emoji: '🐴' },
            { glyph: 'ע', name: 'עַיִן',  word: 'עֵץ',      emoji: '🌳' },
            { glyph: 'פ', name: 'פֵּא',   word: 'פִּיל',     emoji: '🐘' },
            { glyph: 'צ', name: 'צָדִי',  word: 'צָב',      emoji: '🐢' },
            { glyph: 'ק', name: 'קוֹף',   word: 'קוֹף',     emoji: '🐵' },
            { glyph: 'ר', name: 'רֵישׁ',  word: 'רַכֶּבֶת',  emoji: '🚂' },
            { glyph: 'ש', name: 'שִׁין',  word: 'שֶׁמֶשׁ',   emoji: '☀️' },
            { glyph: 'ת', name: 'תָּו',   word: 'תַּפּוּחַ',  emoji: '🍎' },
        ];

        const COLORS = ['#ff6b6b', '#f7b733', '#2ec4b6', '#5f6caf', '#e8618c', '#7bc950', '#f4845f', '#5fa8d3'];

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'he-IL';
            u.rate = 0.85;
            const heVoice = speechSynthesis.getVoices().find(v => v.lang.startsWith('he'));
            if (heVoice) u.voice = heVoice;
            speechSynthesis.speak(u);
        }
        // some browsers load voices asynchronously
        if ('speechSynthesis' in window) speechSynthesis.getVoices();

        /* ---- learn tab ---- */
        const grid = document.getElementById('letterGrid');
        const overlay = document.getElementById('overlay');
        let current = null;

        LETTERS.forEach((letter, i) => {
            const card = document.createElement('button');
            card.className = 'letter-card';
            card.style.background = COLORS[i % COLORS.length];
            card.innerHTML = `<span class="glyph">${letter.glyph}</span><span class="emoji">${letter.emoji}</span>`;
            card.addEventListener('click', () => openLetter(letter));
            grid.appendChild(card);
        });

        function openLetter(letter) {
            current = letter;
            document.getElementById('bigGlyph').textContent = letter.glyph;
            document.getElementById('bigName').textContent = letter.name;
            document.getElementById('bigWord').textContent = `${letter.glyph} כמו ${letter.word}`;
            document.getElementById('bigEmoji').textContent = letter.emoji;
            overlay.classList.add('show');
            speak(`${letter.name}. ${letter.glyph} כמו ${letter.word}`);
        }

        document.getElementById('btnListen').addEventListener('click', () => {
            if (current) speak(`${current.name}. ${current.glyph} כמו ${current.word}`);
        });
        document.getElementById('btnClose').addEventListener('click', () => overlay.classList.remove('show'));
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });

        /* ---- tabs ---- */
        const sections = {
            learn: document.getElementById('learn'),
            game: document.getElementById('game'),
            match: document.getElementById('match'),
        };
        const tabs = {
            learn: document.getElementById('tab-learn'),
            game: document.getElementById('tab-game'),
            match: document.getElementById('tab-match'),
        };
        let score = 0;
        let answer = null;
        let locked = false;

        Object.keys(tabs).forEach(name => tabs[name].addEventListener('click', () => switchTab(name)));

        function switchTab(name) {
            Object.keys(sections).forEach(key => {
                tabs[key].classList.toggle('active', key === name);
                sections[key].style.display = key === name ? 'block' : 'none';
            });
            if (name === 'game') newRound();
            if (name === 'match') newMatchRound();
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function newRound() {
            locked = false;
            document.getElementById('gameFeedback').textContent = '';
            const options = shuffle([...LETTERS]).slice(0, 4);
            answer = options[Math.floor(Math.random() * options.length)];
            document.getElementById('gameTarget').textContent = answer.name + '?';
            const box = document.getElementById('gameOptions');
            box.innerHTML = '';
            shuffle(options).forEach((letter, i) => {
                const btn = document.createElement('button');
                btn.className = 'game-option';
                btn.style.background = COLORS[i % COLORS.length];
                btn.textContent = letter.glyph;
                btn.addEventListener('click', () => pick(btn, letter));
                box.appendChild(btn);
            });
            speak(`איפה האות ${answer.name}?`);
        }

        function pick(btn, letter) {
            if (locked) return;
            const feedback = document.getElementById('gameFeedback');
            if (letter.glyph === answer.glyph) {
                locked = true;
                btn.classList.add('correct');
                score++;
                document.getElementById('gameScore').textContent = score;
                document.getElementById('gameStars').textContent = '⭐'.repeat(Math.min(score, 10));
                feedback.textContent = 'כל הכבוד אריאל! 🎉';
                speak('כל הכבוד אריאל!');
                setTimeout(newRound, 1800);
            } else {
                btn.classList.add('wrong');
                feedback.textContent = 'נסה עוד פעם 💪';
                speak('נסה עוד פעם');
            }
        }

        /* ---- matching game ---- */
        let matchScore = 0;
        let matchRemaining = 0;
        let matchSelected = { letter: null, word: null };

        function newMatchRound() {
            matchSelected = { letter: null, word: null };
            document.getElementById('matchFeedback').textContent = '';
            const chosen = shuffle([...LETTERS]).slice(0, 4);
            matchRemaining = chosen.length;
            const lettersCol = document.getElementById('matchLetters');
            const wordsCol = document.getElementById('matchWords');
            lettersCol.innerHTML = '';
            wordsCol.innerHTML = '';
            chosen.forEach((letter, i) => {
                const btn = document.createElement('button');
                btn.className = 'match-card letter';
                btn.style.background = COLORS[i % COLORS.length];
                btn.textContent = letter.glyph;
                btn.addEventListener('click', () => selectMatch('letter', btn, letter));
                lettersCol.appendChild(btn);
            });
            shuffle([...chosen]).forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'match-card word';
                btn.innerHTML = `<span>${letter.emoji}</span><span>${letter.word}</span>`;
                btn.addEventListener('click', () => selectMatch('word', btn, letter));
                wordsCol.appendChild(btn);
            });
        }

        function selectMatch(side, btn, letter) {
            if (btn.classList.contains('matched')) return;
            if (matchSelected[side]) matchSelected[side].btn.classList.remove('selected');
            matchSelected[side] = { btn, letter };
            btn.classList.add('selected');

            const { letter: l, word: w } = matchSelected;
            if (!l || !w) {
                speak(side === 'letter' ? letter.name : letter.word);
                return;
            }

            const feedback = document.getElementById('matchFeedback');
            if (l.letter.glyph === w.letter.glyph) {
                [l.btn, w.btn].forEach(b => {
                    b.classList.remove('selected');
                    b.classList.add('matched');
                });
                matchRemaining--;
                matchScore++;
                document.getElementById('matchScore').textContent = matchScore;
                if (matchRemaining === 0) {
                    feedback.textContent = 'מדהים אריאל! סיימת את הלוח! 🎉';
                    speak('מדהים אריאל! סיימת את הלוח!');
                    setTimeout(newMatchRound, 2200);
                } else {
                    feedback.textContent = 'יש התאמה! 🌟';
                    speak(`${l.letter.name} כמו ${l.letter.word}. יש התאמה!`);
                }
            } else {
                [l.btn, w.btn].forEach(b => {
                    b.classList.remove('selected');
                    b.classList.add('wrong');
                });
                setTimeout(() => [l.btn, w.btn].forEach(b => b.classList.remove('wrong')), 450);
                feedback.textContent = 'נסה עוד פעם 💪';
                speak('נסה עוד פעם');
            }
            matchSelected = { letter: null, word: null };
        }
    </script>
</body>
</html>
